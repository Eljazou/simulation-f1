<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Séquence des feux de départ</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.cond{font-family:'Barlow Condensed',sans-serif}
.lbl{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8b949e}
</style>
</helmet>
<div style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Barlow',sans-serif;color:#e6edf3;background:#17261c">
<svg aria-hidden="true" width="1280" height="720" viewBox="0 0 1280 720" style="position:absolute;inset:0">
<rect y="250" width="1280" height="300" fill="#e9e9e9"></rect>
<rect y="256" width="1280" height="288" fill="#2b2e33"></rect>
<rect y="250" width="1280" height="6" fill="#c8102e" opacity=".7"></rect><rect y="544" width="1280" height="6" fill="#c8102e" opacity=".7"></rect>
<g fill="#fff"><rect x="960" y="256" width="8" height="288"></rect></g>
<g stroke="#fff" stroke-width="3" fill="none" opacity=".75">
<path d="M900 300h-50v40h50"></path><path d="M820 440h-50v40h50"></path><path d="M740 300h-50v40h50"></path><path d="M660 440h-50v40h50"></path><path d="M580 300h-50v40h50"></path><path d="M500 440h-50v40h50"></path><path d="M420 300h-50v40h50"></path><path d="M340 440h-50v40h50"></path><path d="M260 300h-50v40h50"></path><path d="M180 440h-50v40h50"></path>
</g>
<g stroke="#0b0c0f" stroke-width="2">
<rect x="852" y="306" width="56" height="28" rx="9" fill="#19c3a6"></rect><rect x="772" y="446" width="56" height="28" rx="9" fill="#2f7bff"></rect><rect x="692" y="306" width="56" height="28" rx="9" fill="#2f7bff"></rect><rect x="612" y="446" width="56" height="28" rx="9" fill="#ff8a1f" stroke="#fff" stroke-width="3"></rect><rect x="532" y="306" width="56" height="28" rx="9" fill="#d9dde3"></rect><rect x="452" y="446" width="56" height="28" rx="9" fill="#c0186b"></rect><rect x="372" y="306" width="56" height="28" rx="9" fill="#f2c200"></rect><rect x="292" y="446" width="56" height="28" rx="9" fill="#d9dde3"></rect><rect x="212" y="306" width="56" height="28" rx="9" fill="#ff8a1f"></rect><rect x="132" y="446" width="56" height="28" rx="9" fill="#19c3a6"></rect>
</g>
</svg>
<div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);height:40px;padding:0 18px;border-radius:8px;background:rgba(15,17,21,.85);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px" class="cond">
<span style="width:8px;height:8px;border-radius:50%;background:#e10600"></span><span style="font-size:16px;font-weight:600;letter-spacing:.08em">DÉPART · GRILLE · SEC</span>
</div>

<div role="img" aria-label="{{aria}}" style="position:absolute;top:72px;left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:12px 16px;border-radius:10px;background:#0b0c0f;border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 32px rgba(0,0,0,.5)">
<sc-for list="{{lamps}}" as="l" hint-placeholder-count="5">
<div style="width:56px;padding:8px 0;border-radius:8px;background:#16181c;display:flex;flex-direction:column;align-items:center;gap:8px">
<span style="width:38px;height:38px;border-radius:50%;background:#2a1414"></span>
<span style="{{l.s}}"></span>
<span style="{{l.s}}"></span>
</div>
</sc-for>
</div>

<div style="position:absolute;top:290px;left:50%;transform:translateX(-50%);text-align:center">
<sc-if value="{{go}}" hint-placeholder-val="{{false}}"><div class="cond" style="font-size:72px;font-weight:700;letter-spacing:.06em;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.6)">GO !</div></sc-if>
</div>

<div style="position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:640px;box-sizing:border-box;padding:12px 16px;border-radius:8px;background:rgba(15,17,21,.85);border:1px solid rgba(255,255,255,.08)">
<div style="display:flex;justify-content:space-between;margin-bottom:10px"><span class="lbl">Séquence · 1 feu par seconde, extinction aléatoire 0,2–3 s</span><span class="lbl" style="color:#c9d1d9">Faux départ = +5 s</span></div>
<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="7">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:6px;{{s.bg}}">
<span style="display:flex;gap:3px"><sc-for list="{{s.dots}}" as="d" hint-placeholder-count="5"><span style="width:8px;height:8px;border-radius:50%;background:{{d.c}}"></span></sc-for></span>
<span class="cond" style="font-size:12px;font-weight:600;letter-spacing:.06em;color:{{s.tc}}">{{s.t}}</span>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lit":{"editor":"range","min":0,"max":6,"step":1,"default":3},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const lit = this.props.lit ?? 3;
    const go = lit >= 6;
    const on = 'width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff6a5c,#e10600 55%,#8a0400);box-shadow:0 0 18px rgba(225,6,0,.85)';
    const off = 'width:38px;height:38px;border-radius:50%;background:#2a1414';
    const lamps = [0, 1, 2, 3, 4].map(i => ({ s: !go && i < lit ? on : off }));
    const labels = ['Prêt', '1', '2', '3', '4', '5', 'Extinction'];
    const steps = labels.map((t, k) => ({
      t, tc: k === lit ? '#fff' : '#8b949e', bg: k === lit ? 'background:rgba(225,6,0,.18);box-shadow:inset 0 0 0 1px rgba(225,6,0,.6)' : 'background:rgba(255,255,255,.03)',
      dots: [0, 1, 2, 3, 4].map(i => ({ c: k < 6 && i < k ? '#e10600' : (k === 6 ? '#2ecc71' : 'rgba(255,255,255,.12)') }))
    }));
    return { lamps, steps, go, aria: go ? 'Feux éteints : départ' : lit + ' feux allumés sur 5' };
  }
}
</script>
</body>
</html>
