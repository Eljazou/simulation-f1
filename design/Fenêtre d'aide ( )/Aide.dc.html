<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fenêtre d'aide — raccourcis</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.cond{font-family:'Barlow Condensed',sans-serif}
.lbl{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8b949e}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;box-sizing:border-box;border-radius:5px;background:#1d2128;border:1px solid rgba(255,255,255,.14);border-bottom-width:2px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:#e6edf3}
</style>
</helmet>
<div style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Barlow',sans-serif;color:#e6edf3;background:#14211a">
<svg aria-hidden="true" width="1280" height="720" viewBox="0 0 1920 1080" style="position:absolute;inset:0">
<g fill="none"><path d="M 560 300 C 700 180, 1000 200, 1150 260 C 1300 320, 1420 240, 1520 330 C 1620 420, 1560 560, 1440 600 C 1320 640, 1300 760, 1200 820 C 1080 890, 820 880, 700 820 C 580 760, 640 640, 560 600 C 460 550, 420 400, 560 300 Z" stroke="#e9e9e9" stroke-width="54"></path><path d="M 560 300 C 700 180, 1000 200, 1150 260 C 1300 320, 1420 240, 1520 330 C 1620 420, 1560 560, 1440 600 C 1320 640, 1300 760, 1200 820 C 1080 890, 820 880, 700 820 C 580 760, 640 640, 560 600 C 460 550, 420 400, 560 300 Z" stroke="#2b2e33" stroke-width="44"></path></g>
</svg>
<div style="position:absolute;inset:0;background:rgba(5,6,8,.62);backdrop-filter:blur(3px)"></div>
<div role="dialog" aria-modal="true" aria-labelledby="aide-t" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:760px;box-sizing:border-box;border-radius:8px;background:rgba(15,17,21,.96);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 64px rgba(0,0,0,.5);overflow:hidden">
<div style="display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 12px 0 20px;border-bottom:1px solid rgba(255,255,255,.08)">
<div style="display:flex;align-items:center;gap:10px"><span style="width:4px;height:20px;background:#e10600;border-radius:2px"></span><h2 id="aide-t" class="cond" style="margin:0;font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Commandes et raccourcis</h2></div>
<div style="display:flex;align-items:center;gap:10px"><span class="lbl" style="font-size:11px;text-transform:none;letter-spacing:.02em">Fermer</span><kbd>Échap</kbd>
<button aria-label="Fermer l'aide" style="width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:#8b949e;cursor:pointer"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px;padding:20px 24px 8px 24px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section style="margin-bottom:18px">
<h3 class="lbl" style="margin:0 0 8px 0;color:#e10600;font-size:13px">{{g.name}}</h3>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
<div style="display:flex;align-items:center;justify-content:space-between;min-height:34px;border-top:1px solid rgba(255,255,255,.05)">
<span style="font-size:14px">{{r.a}}</span>
<span style="display:flex;gap:4px;align-items:center"><sc-for list="{{r.k}}" as="k" hint-placeholder-count="2"><sc-if value="{{k.or}}" hint-placeholder-val="{{false}}"><span style="font-size:11px;color:#6e7781;padding:0 2px">ou</span></sc-if><sc-if value="{{k.key}}" hint-placeholder-val="{{true}}"><kbd>{{k.t}}</kbd></sc-if></sc-for></span>
</div>
</sc-for>
</section>
</sc-for>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:rgba(255,255,255,.03);border-top:1px solid rgba(255,255,255,.06)">
<span style="font-size:12px;color:#8b949e">Multijoueur : J1 = WASD + Espace · J2 = flèches + Entrée</span>
<span style="font-size:12px;color:#8b949e;display:flex;gap:6px;align-items:center">Rouvrir cette aide <kbd>?</kbd></span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const K = (...ks) => { const out = []; ks.forEach((k, i) => { if (k === '|') out.push({ or: true, key: false, t: '' }); else out.push({ or: false, key: true, t: k }); }); return out; };
    const groups = [
      { name: 'Conduite', rows: [{ a: 'Accélérer', k: K('W', '|', '↑') }, { a: 'Freiner', k: K('S', '|', '↓') }, { a: 'Diriger', k: K('A', 'D', '|', '←', '→') }, { a: 'Ouvrir le DRS', k: K('Espace') }] },
      { name: 'Vue', rows: [{ a: 'Changer de caméra', k: K('C') }, { a: 'Pilote suivant / précédent', k: K('[', ']') }, { a: 'Zoom carte', k: K('+', '−') }, { a: 'Plein écran', k: K('F') }] },
      { name: 'Interface', rows: [{ a: 'Ouvrir / fermer le panneau', k: K('Tab') }, { a: 'Onglet du panneau', k: K('1', '2', '3', '4') }, { a: 'Écart ↔ intervalle', k: K('G') }, { a: 'Masquer toute l’interface', k: K('H') }] },
      { name: 'Course', rows: [{ a: 'Pause / menu', k: K('Échap', '|', 'P') }, { a: 'Demander un arrêt au stand', k: K('B') }, { a: 'Recommencer', k: K('R') }, { a: 'Cette aide', k: K('?') }] }
    ];
    return { groups };
  }
}
</script>
</body>
</html>
