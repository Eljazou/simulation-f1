<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Monoplace — zoom coté et états</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:1720px;height:1120px;position:relative;box-sizing:border-box;background:#0d1013;font-family:'Barlow',sans-serif;color:#e6edf3;overflow:hidden">
<div style="position:absolute;left:40px;top:24px;display:flex;align-items:baseline;gap:14px"><span style="width:4px;height:20px;background:#e10600;border-radius:2px;align-self:center"></span><h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;letter-spacing:.04em;text-transform:uppercase">Monoplace vue de dessus</h1><span style="font-size:13px;color:#8b949e">Corsa Nera #7 · MIR · zoom ×6 · cotes en px à 1920×1080</span></div>

<div style="position:absolute;left:40px;top:70px;width:960px;height:600px;border-radius:8px;background-color:#14181c;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:30px 30px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)">
<div style="position:absolute;left:0;top:0"><dc-import name="CarSprite" equipe="corsa" etat="normal" pneu="M" echelle="6" fond="{{no}}" hint-size="960px,600px"></dc-import></div>

<sc-for list="{{dims}}" as="d" hint-placeholder-count="3">
<div style="{{d.bar}}"></div>
<div style="{{d.lab}}"><b style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#fff">{{d.v}}</b> <span style="color:#a3acb6">{{d.t}}</span></div>
</sc-for>
<sc-for list="{{calls}}" as="c" hint-placeholder-count="8">
<div style="{{c.box}}"></div>
<div style="{{c.line}}"></div>
<div style="{{c.lab}}"><span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff">{{c.n}}</span><br><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#a3acb6">{{c.v}}</span></div>
</sc-for>
</div>

<section style="position:absolute;left:1040px;top:70px;width:640px;display:flex;flex-direction:column;gap:16px">
<div style="border-radius:8px;background:rgba(15,17,21,.85);border:1px solid rgba(255,255,255,.08);overflow:hidden">
<div style="padding:10px 16px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.08)">Proportions · sprite 77 × 33 px</div>
<sc-for list="{{spec}}" as="s" hint-placeholder-count="12">
<div style="display:grid;grid-template-columns:200px 120px 1fr;column-gap:12px;align-items:center;min-height:28px;padding:0 16px;border-top:1px solid rgba(255,255,255,.04);font-size:13px">
<span>{{s.n}}</span><span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#fff">{{s.v}}</span><span style="font-size:12px;color:#8b949e">{{s.c}}</span>
</div>
</sc-for>
</div>
<div style="border-radius:8px;background:rgba(15,17,21,.85);border:1px solid rgba(255,255,255,.08);padding:12px 16px">
<div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px">Les 10 livrées fictives</div>
<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px">
<sc-for list="{{liv}}" as="l" hint-placeholder-count="10">
<div style="display:flex;flex-direction:column;align-items:center;gap:2px">
<dc-import name="CarSprite" equipe="{{l.k}}" etat="normal" pneu="{{l.ty}}" echelle="0.72" fond="{{no}}" hint-size="115px,72px"></dc-import>
<span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700">{{l.n}}</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#8b949e">#{{l.num}} {{l.code}}</span>
</div>
</sc-for>
</div>
</div>
</section>

<div style="position:absolute;left:40px;top:690px;width:1020px;display:grid;grid-template-columns:repeat(4,240px);column-gap:20px;row-gap:18px">
<sc-for list="{{states}}" as="s" hint-placeholder-count="8">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="width:240px;height:150px;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)"><dc-import name="CarSprite" equipe="{{s.k}}" etat="{{s.e}}" pneu="{{s.ty}}" echelle="1.5" fond="{{yes}}" hint-size="240px,150px"></dc-import></div>
<div style="display:flex;align-items:baseline;gap:8px"><span style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.05em;text-transform:uppercase">{{s.n}}</span><span style="font-size:11.5px;color:#8b949e;line-height:1.3">{{s.d}}</span></div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1720,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const X = v => (v + 110) * 6, Y = v => (v + 50) * 6;
    const hb = (x1, x2, y) => 'position:absolute;left:' + x1 + 'px;top:' + (y - 6) + 'px;width:' + (x2 - x1) + 'px;height:12px;box-sizing:border-box;border-left:1px solid #e10600;border-right:1px solid #e10600;background:linear-gradient(#e10600,#e10600) center/100% 1px no-repeat';
    const vb = (y1, y2, x) => 'position:absolute;left:' + (x - 6) + 'px;top:' + y1 + 'px;width:12px;height:' + (y2 - y1) + 'px;box-sizing:border-box;border-top:1px solid #e10600;border-bottom:1px solid #e10600;background:linear-gradient(#e10600,#e10600) center/1px 100% no-repeat';
    const lab = (x, y, align) => 'position:absolute;left:' + x + 'px;top:' + y + 'px;transform:translateX(' + (align === 'c' ? '-50%' : '0') + ');white-space:nowrap;font-size:12px;padding:2px 6px;border-radius:4px;background:#0d1013';
    const dims = [
      { bar: hb(X(-40.6), X(37), 450), lab: lab((X(-40.6) + X(37)) / 2, 464, 'c'), v: '77 px', t: 'longueur hors tout' },
      { bar: vb(Y(-16.6), Y(16.6), 930), lab: lab(944, (Y(-16.6) + Y(16.6)) / 2 - 10, 'l'), v: '33 px', t: 'largeur (dérives AV)' },
      { bar: hb(X(-23.5), X(19.5), 160), lab: lab((X(-23.5) + X(19.5)) / 2, 128, 'c'), v: '43 px', t: 'empattement' }
    ];
    const C = (n, v, x1, y1, x2, y2, side, lx) => {
      const top = side === 'top';
      const ly = top ? 40 : 520;
      return { n, v,
        box: 'position:absolute;left:' + x1 + 'px;top:' + y1 + 'px;width:' + (x2 - x1) + 'px;height:' + (y2 - y1) + 'px;box-sizing:border-box;border:1px dashed rgba(255,255,255,.55);border-radius:3px',
        line: 'position:absolute;left:' + ((x1 + x2) / 2) + 'px;top:' + (top ? ly + 36 : y2) + 'px;width:1px;height:' + (top ? y1 - ly - 36 : ly - y2) + 'px;background:rgba(255,255,255,.35)',
        lab: 'position:absolute;left:' + lx + 'px;top:' + ly + 'px;line-height:1.2' };
    };
    const calls = [
      C('Aileron arrière', '9 × 28 · 2 plans', X(-40.6), Y(-14), X(-30.5), Y(14), 'top', 380),
      C('Roue AR', '15 × 7 · flanc 1.6', X(-31), Y(-16), X(-16), Y(-9), 'top', 500),
      C('Roue AV', '13 × 6.5 · braquage ±22°', X(13), Y(-15.5), X(26), Y(-9), 'top', 735),
      C('Aileron avant', '8 × 33 · 3 éléments', X(29), Y(-16.6), X(37), Y(16.6), 'top', 850),
      C('Pontons + prises d’air', '30 × 23', X(-23), Y(-11.6), X(7), Y(11.6), 'bottom', 520),
      C('Numéro', '6.6 px · capot', X(-19), Y(-3), X(-11), Y(3), 'bottom', 400),
      C('Cockpit · halo · casque', 'Ø casque 5.2', X(9), Y(-3.9), X(22), Y(3.9), 'bottom', 700),
      C('Nez effilé', '18 × 6.8', X(18), Y(-3.4), X(36.5), Y(3.4), 'bottom', 860)
    ];
    const spec = [
      { n: 'Longueur hors tout', v: '77 px', c: '≈ 5,6 m · 1 px ≈ 7 cm' }, { n: 'Largeur (dérives AV)', v: '33 px', c: 'roues : ±16 px de l’axe' },
      { n: 'Empattement', v: '43 px', c: 'essieux à x = −23.5 et +19.5' }, { n: 'Voie AV / AR', v: '24.5 / 25 px', c: 'entre centres de roues' },
      { n: 'Roue AV / AR', v: '13×6.5 / 15×7', c: 'r 2.3 · flanc 1.6 couleur pneu' }, { n: 'Aileron AV', v: '8 × 33 px', c: 'plan carbone 5 + volets 1.8 et 1.3' },
      { n: 'Aileron AR', v: '9 × 28 px', c: 'DRS : volet 2.6 → 1.2, fente 1.4 noire' }, { n: 'Pontons', v: '30 × 23 px', c: 'dégradé clair → p1 → foncé' },
      { n: 'Casque · halo', v: 'Ø 5.2 · 1.4', c: 'halo #2b2e33 · visière #0b0b0b' }, { n: 'Ombre portée', v: '+4, +6 · flou 3', c: 'noir 50 % (pluie 25 %)' },
      { n: 'Feu de pluie', v: '1.9 × 3 px', c: 'éteint #5a1512 · allumé #ff2a1f + halo 5' }, { n: 'À 1280×720', v: '51 px', c: '× 0,667 · jamais sous 48 px' }
    ];
    const L = [['halden', 'Halden', 4, 'KAR', 'M'], ['corsa', 'Corsa Nera', 7, 'MIR', 'M'], ['velis', 'Velis GP', 16, 'TAV', 'S'], ['kestrel', 'Kestrel', 9, 'LUN', 'H'], ['ardent', 'Ardent', 27, 'SKO', 'M'],
      ['moravia', 'Moravia', 11, 'BRE', 'S'], ['aurel', 'Aurel', 63, 'ROW', 'S'], ['novaro', 'Novaro', 18, 'FEN', 'H'], ['sable', 'Sable', 5, 'ILM', 'M'], ['tessa', 'Tessa', 44, 'YSA', 'S']];
    const liv = L.map(l => ({ k: l[0], n: l[1], num: l[2], code: l[3], ty: l[4] }));
    const states = [
      { k: 'corsa', e: 'normal', ty: 'M', n: 'Normale', d: 'roues droites, feu AR éteint' },
      { k: 'halden', e: 'freinage', ty: 'M', n: 'Freinage', d: 'feu AR rouge, disques incandescents, fumée' },
      { k: 'aurel', e: 'glisse', ty: 'S', n: 'Glisse', d: 'caisse −18° vs trajectoire, contre-braquage, gomme' },
      { k: 'velis', e: 'drs', ty: 'S', n: 'DRS ouvert', d: 'volet AR relevé : fente noire visible' },
      { k: 'novaro', e: 'stand', ty: 'H', n: 'Au stand', d: '10 mécaniciens aux couleurs de l’écurie' },
      { k: 'halden', e: 'difficulte', ty: 'M', n: 'En difficulté', d: 'étincelles sous le fond plat' },
      { k: 'corsa', e: 'suivie', ty: 'M', n: 'Suivie', d: 'halo pulsé rouge + étiquette code' },
      { k: 'tessa', e: 'abandon', ty: 'S', n: 'Abandon', d: 'désaturée 12 %, assombrie, immobile' }
    ];
    return { dims, calls, spec, liv, states, no: false, yes: true };
  }
}
</script>
</body>
</html>
