<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mini-carte</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<section aria-label="Mini-carte du circuit" style="width:280px;height:200px;box-sizing:border-box;position:relative;border-radius:8px;background:rgba(15,17,21,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09);box-shadow:0 8px 24px rgba(0,0,0,.4);overflow:hidden;font-family:'Barlow Condensed',sans-serif;color:#e6edf3">
<div style="height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 10px;border-bottom:1px solid rgba(255,255,255,.06)">
<span style="font-size:12px;font-weight:700;letter-spacing:.1em;color:#e6edf3">VALMORA <span style="color:#6e7781">·</span> <span style="color:#8b949e;font-weight:600">4,82 KM</span></span>
<span style="display:flex;align-items:center;gap:2px">
<span role="group" aria-label="Mode de la carte" style="display:flex;padding:2px;border-radius:5px;background:rgba(255,255,255,.05)">
<button aria-label="Circuit complet" aria-pressed="{{isFull}}" onClick="{{setFull}}" style="{{btnFull}}"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M5 7c3-3 9-3 12 0s3 8-1 10-5-1-8 0-5-1-5-4 0-4 2-6z"></path></svg></button>
<button aria-label="Zoom sur ma voiture" aria-pressed="{{isZoom}}" onClick="{{setZoom}}" style="{{btnZoom}}"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="6"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg></button>
</span>
<button aria-label="Agrandir la carte dans le panneau latéral" style="width:24px;height:24px;border:0;border-radius:5px;background:transparent;color:#8b949e;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"></path></svg></button>
</span>
</div>

<svg role="img" aria-label="{{aria}}" width="280" height="146" viewBox="{{vb}}" preserveAspectRatio="xMidYMid meet" style="display:block">
<sc-if value="{{isZoom}}" hint-placeholder-val="{{false}}">
<path d="{{trackD}}" fill="none" stroke="#7d848d" stroke-width="110" stroke-linejoin="round" opacity=".6"></path>
<path d="{{trackD}}" fill="none" stroke="#2c3036" stroke-width="100" stroke-linejoin="round"></path>
<path d="{{pitD}}" fill="none" stroke="#25282d" stroke-width="34"></path>
<g transform="translate(800 110)"><rect width="10" height="100" fill="#e6edf3" opacity=".8"></rect></g>
</sc-if>
<path d="{{trackD}}" fill="none" stroke="#06080b" stroke-width="{{w.contour}}" stroke-linejoin="round" opacity="{{w.cOp}}"></path>
<path d="{{pitD}}" fill="none" stroke="#7d848d" stroke-width="{{w.pit}}" opacity="{{w.pitOp}}"></path>
<sc-for list="{{sectors}}" as="s" hint-placeholder-count="3"><path d="{{s.d}}" fill="none" stroke="{{s.c}}" stroke-width="{{w.track}}" stroke-linejoin="round" stroke-linecap="round" opacity="{{s.o}}"></path></sc-for>
<sc-if value="{{yellow}}" hint-placeholder-val="{{false}}"><path d="{{s2d}}" fill="none" stroke="#f5c518" stroke-width="{{w.flag}}" stroke-linecap="round" opacity=".9"><animate attributeName="opacity" values=".9;.45;.9" dur="1s" repeatCount="indefinite"></animate></path></sc-if>
<sc-for list="{{drs}}" as="z" hint-placeholder-count="2"><path d="{{z.d}}" fill="none" stroke="#2ecc71" stroke-width="{{w.drs}}" stroke-linecap="round"></path></sc-for>
<g transform="{{fin.tf}}"><sc-for list="{{fin.q}}" as="q" hint-placeholder-count="8"><rect x="{{q.x}}" y="{{q.y}}" width="2.5" height="2.5" fill="{{q.c}}"></rect></sc-for></g>
<sc-for list="{{turns}}" as="t" hint-placeholder-count="5"><g transform="{{t.tf}}"><text text-anchor="middle" y="3" font-size="8" font-weight="700" fill="#8b949e" letter-spacing=".5">{{t.n}}</text></g></sc-for>
<sc-if value="{{yellow}}" hint-placeholder-val="{{false}}">
<g transform="{{flag}}"><circle r="8" fill="#0f1115" stroke="#f5c518" stroke-width="1.2"></circle><path d="M-3 4.5V-4.5M-3 -4.5H4L2.4 -2 4 .5H-3" fill="#f5c518" stroke="#f5c518" stroke-width="1" stroke-linejoin="round"></path></g>
</sc-if>
<sc-for list="{{dots}}" as="d" hint-placeholder-count="12">
<g transform="{{d.tf}}" onMouseEnter="{{d.enter}}" onMouseLeave="{{d.leave}}" style="cursor:pointer">
<sc-if value="{{d.zoomCar}}" hint-placeholder-val="{{false}}"><g transform="{{d.rot}}"><rect x="-15" y="-6" width="30" height="12" rx="4" fill="{{d.c}}" stroke="#fff" stroke-width="1"></rect><rect x="4" y="-2" width="5" height="4" rx="1" fill="#0b0c0f"></rect></g></sc-if>
<sc-if value="{{d.dot}}" hint-placeholder-val="{{true}}"><circle r="4" fill="{{d.c}}" stroke="#fff" stroke-width="1" opacity="{{d.o}}"></circle></sc-if>
<sc-if value="{{d.dnf}}" hint-placeholder-val="{{false}}"><path d="M-4 -4L4 4M4 -4L-4 4" stroke="#e6edf3" stroke-width="1.4"></path></sc-if>
<sc-if value="{{d.pit}}" hint-placeholder-val="{{false}}"><g transform="translate(8 -8)"><circle r="5.5" fill="#ff8a1f"></circle><path d="M1.6 -2.4a1.9 1.9 0 0 0-2.4 2.4L-2.6 1.8l.8.8 1.8-1.8a1.9 1.9 0 0 0 2.4-2.4l-.9.9-.8-.2-.2-.8z" fill="#0f1115"></path></g></sc-if>
<sc-if value="{{d.leader}}" hint-placeholder-val="{{false}}"><g transform="translate(0 -10)"><rect x="-4.5" y="-5" width="9" height="9" rx="2" fill="#e6edf3"></rect><text y="2.6" text-anchor="middle" font-size="8" font-weight="700" fill="#0f1115">1</text></g></sc-if>
<sc-if value="{{d.label}}" hint-placeholder-val="{{false}}"><text x="{{d.lx}}" y="3" font-size="9" font-weight="700" fill="#e6edf3" letter-spacing=".5">{{d.code}}</text></sc-if>
</g>
</sc-for>
<sc-if value="{{sc}}" hint-placeholder-val="{{false}}"><g transform="{{scPos}}"><circle r="7" fill="#ff8a1f" stroke="#fff" stroke-width="1"></circle><text y="2.6" text-anchor="middle" font-size="7" font-weight="700" fill="#0f1115">SC</text></g></sc-if>
<g transform="{{fol.tf}}">
<circle r="6" fill="none" stroke="#e10600" stroke-width="1.6"><animate attributeName="r" values="6;13" dur="1.4s" repeatCount="indefinite"></animate><animate attributeName="opacity" values="1;0" dur="1.4s" repeatCount="indefinite"></animate></circle>
<circle r="5" fill="#ff8a1f" stroke="#fff" stroke-width="1.4"></circle>
<g transform="translate(0 -15)"><rect x="-15" y="-7" width="30" height="13" rx="2.5" fill="#e10600"></rect><text y="3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff" letter-spacing=".5">MIR</text></g>
</g>
</svg>

<sc-if value="{{tip.show}}" hint-placeholder-val="{{false}}">
<div role="tooltip" style="{{tip.style}}"><span style="font-family:'JetBrains Mono',monospace;color:#8b949e">#{{tip.num}}</span> <b style="letter-spacing:.04em">{{tip.code}}</b> <span style="color:#6e7781">·</span> {{tip.pos}} <span style="color:#6e7781">·</span> <span style="font-family:'JetBrains Mono',monospace;color:{{tip.gc}}">{{tip.gap}}</span></div>
</sc-if>
<sc-if value="{{sc}}" hint-placeholder-val="{{false}}"><div style="position:absolute;left:8px;top:34px;padding:2px 7px;border-radius:4px;background:#f5c518;color:#0f1115;font-size:11px;font-weight:700;letter-spacing:.08em">SAFETY CAR</div></sc-if>
<sc-if value="{{yellow}}" hint-placeholder-val="{{false}}"><div style="position:absolute;left:8px;top:34px;padding:2px 7px;border-radius:4px;background:rgba(15,17,21,.9);border:1px solid #f5c518;color:#f5c518;font-size:11px;font-weight:700;letter-spacing:.08em">JAUNE · S2</div></sc-if>

<div style="position:absolute;left:0;right:0;bottom:0;height:26px;display:grid;grid-template-columns:auto 1fr auto;column-gap:8px;align-items:center;padding:0 10px;border-top:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.18)">
<span style="font-size:12px;font-weight:700;letter-spacing:.06em">T3<span style="color:#8b949e">/5</span></span>
<span style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px" aria-label="Progression du tour : secteur 1, 28 %">
<sc-for list="{{bar}}" as="b" hint-placeholder-count="3"><span style="height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;position:relative"><span style="position:absolute;left:0;top:0;bottom:0;width:{{b.w}};background:{{b.c}}"></span></span></sc-for>
</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#8b949e">S1 <span style="color:#e6edf3">9 %</span></span>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["complet","zoom"],"default":"complet"},"evenement":{"editor":"enum","options":["aucun","jaune","sc"],"default":"aucun"},"infobulle":{"editor":"text","default":""},"$preview":{"width":280,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = (this.state && this.state.mode) || this.props.mode || 'complet';
    const ev = this.props.evenement ?? 'aucun';
    const hov = (this.state && this.state.hov) || this.props.infobulle || '';
    const zoom = mode === 'zoom';
    const f = n => Math.round(n * 10) / 10;
    const Lp = (a, b) => [a, [a[0] + (b[0] - a[0]) / 3, a[1] + (b[1] - a[1]) / 3], [a[0] + 2 * (b[0] - a[0]) / 3, a[1] + 2 * (b[1] - a[1]) / 3], b];
    const SEG = [
      Lp([470, 160], [1440, 160]), [[1440, 160], [1500, 160], [1545, 190], [1545, 250]], Lp([1545, 250], [1545, 470]),
      [[1545, 470], [1545, 520], [1615, 520], [1615, 570]], [[1615, 570], [1615, 620], [1560, 620], [1560, 670]],
      [[1560, 670], [1560, 740], [1760, 720], [1760, 820]], [[1760, 820], [1760, 900], [1700, 950], [1620, 950]],
      Lp([1620, 950], [1120, 950]), [[1120, 950], [1040, 950], [1000, 910], [1000, 840]], Lp([1000, 840], [1000, 650]),
      [[1000, 650], [1000, 530], [840, 530], [840, 650]], Lp([840, 650], [840, 760]), [[840, 760], [840, 830], [800, 850], [720, 850]],
      Lp([720, 850], [600, 850]), [[600, 850], [450, 850], [380, 770], [380, 640]], Lp([380, 640], [380, 300]), [[380, 300], [380, 200], [400, 160], [470, 160]]
    ];
    const P = p => f(p[0]) + ' ' + f(p[1]);
    const trackD = 'M470 160 ' + SEG.map(s => 'C' + P(s[1]) + ', ' + P(s[2]) + ', ' + P(s[3])).join(' ') + ' Z';
    const bez = (s, t) => { const u = 1 - t;
      const x = u * u * u * s[0][0] + 3 * u * u * t * s[1][0] + 3 * u * t * t * s[2][0] + t * t * t * s[3][0];
      const y = u * u * u * s[0][1] + 3 * u * u * t * s[1][1] + 3 * u * t * t * s[2][1] + t * t * t * s[3][1];
      const dx = 3 * u * u * (s[1][0] - s[0][0]) + 6 * u * t * (s[2][0] - s[1][0]) + 3 * t * t * (s[3][0] - s[2][0]);
      const dy = 3 * u * u * (s[1][1] - s[0][1]) + 6 * u * t * (s[2][1] - s[1][1]) + 3 * t * t * (s[3][1] - s[2][1]);
      return { x, y, a: Math.atan2(dy, dx) * 180 / Math.PI }; };
    const at = (i, t, lat) => { const p = bez(SEG[i], t); const r = p.a * Math.PI / 180; return { x: p.x - Math.sin(r) * lat, y: p.y + Math.cos(r) * lat, a: p.a }; };
    const poly = (parts, lat) => { let s = ''; parts.forEach(([i, t0, t1]) => { for (let k = 0; k <= 14; k++) { const p = at(i, t0 + (t1 - t0) * k / 14, lat || 0); s += (s ? ' L' : 'M') + f(p.x) + ' ' + f(p.y); } }); return s; };
    const tF = (800 - 470) / 970;
    const S1 = [[0, tF, 1], [1, 0, 1], [2, 0, 1], [3, 0, 1], [4, 0, 1]];
    const S2 = [[5, 0, 1], [6, 0, 1], [7, 0, 1], [8, 0, 1], [9, 0, 1]];
    const S3 = [[10, 0, 1], [11, 0, 1], [12, 0, 1], [13, 0, 1], [14, 0, 1], [15, 0, 1], [16, 0, 1], [0, 0, tF]];
    // vue
    let vbx = 300, vby = 60, vbw = 1560, vbh = 980;
    if (zoom) { vbw = 760; vbh = 396; vbx = 1183 - vbw / 2; vby = 175 - vbh / 2; }
    const sc = Math.min(280 / vbw, 146 / vbh), k = 1 / sc;
    const offX = (280 - vbw * sc) / 2, offY = (146 - vbh * sc) / 2;
    const toScr = (x, y) => ({ x: offX + (x - vbx) * sc, y: 28 + offY + (y - vby) * sc });
    const w = zoom ? { contour: 0, cOp: 0, track: 3 * k, pit: 0, pitOp: 0, drs: 2.5 * k, flag: 8 * k } : { contour: 9 * k, cOp: 1, track: 6 * k, pit: 2 * k, pitOp: 1, drs: 2.5 * k, flag: 10 * k };
    const sectors = [{ d: poly(S1), c: '#5b8def', o: zoom ? .9 : 1 }, { d: poly(S2), c: '#e0b84a', o: zoom ? .9 : 1 }, { d: poly(S3), c: '#4fbf86', o: zoom ? .9 : 1 }];
    const drsOff = zoom ? 62 : 7 * k;
    const drs = [{ d: poly([[0, (560 - 470) / 970, (1300 - 470) / 970]], -drsOff) }, { d: poly([[7, (1620 - 1580) / 500, (1620 - 1160) / 500]], -drsOff) }];
    const kq = 'scale(' + f(k * 100) / 100 + ')';
    const fq = []; for (let c = 0; c < 2; c++) for (let r = 0; r < 4; r++) fq.push({ x: c * 2.5 - 2.5, y: r * 2.5 - 5, c: (r + c) % 2 ? '#111' : '#fff' });
    const fin = { tf: 'translate(800 160) ' + kq, q: fq };
    const tl = (n, i, t, lat) => { const p = at(i, t, lat); return { n, tf: 'translate(' + f(p.x) + ' ' + f(p.y) + ') ' + kq }; };
    const turns = zoom ? [] : [tl('T1', 1, .55, -16 * k), tl('T2', 3, .6, 14 * k), tl('T4', 5, .55, -14 * k), tl('T7', 10, .5, 13 * k), tl('T9', 14, .5, -15 * k)];
    const C = [
      ['KAR', 4, '#2f7bff', 'P1', 'Leader', { seg: 0, t: .86, lat: 0 }, 'leader'],
      ['MIR', 7, '#ff8a1f', 'P2', '+1.284', { seg: 0, t: .735, lat: 0 }, 'follow'],
      ['TAV', 16, '#19c3a6', 'P3', '+2.031', { seg: 0, t: .645, lat: 28 }, ''],
      ['ODE', 22, '#2f7bff', 'P4', '+4.556', { seg: 7, t: .80, lat: 0 }, ''],
      ['LUN', 9, '#f2c200', 'P5', '+6.102', { seg: 7, t: .60, lat: 0 }, ''],
      ['SKO', 27, '#d9dde3', 'P6', '+7.890', { seg: 7, t: .42, lat: 0 }, ''],
      ['BRE', 11, '#c0186b', 'P7', '+9.415', { seg: 7, t: .25, lat: 0 }, ''],
      ['ADE', 31, '#ff8a1f', 'P8', '+11.207', { seg: 10, t: .60, lat: 0 }, ''],
      ['ROW', 63, '#2fb36a', 'P9', '+15.338', { seg: 10, t: .565, lat: 0 }, ''],
      ['FEN', 18, '#8fa6ff', 'P10', 'PIT', { x: 1147, y: 258 }, 'pit'],
      ['ILM', 5, '#c9a24a', 'P11', 'OUT', { x: 1489, y: 392 }, 'out'],
      ['YSA', 44, '#c9773f', '—', 'ABD', { x: 1798, y: 978 }, 'dnf']
    ];
    const minGap = zoom ? 0 : 9;
    const placed = C.map(c => { const pl = c[5]; let p, n = { x: 0, y: 1 };
      if (pl.seg !== undefined) { p = at(pl.seg, pl.t, zoom ? pl.lat : 0); const r = p.a * Math.PI / 180; n = { x: -Math.sin(r), y: Math.cos(r) }; } else p = { x: pl.x, y: pl.y, a: 0 };
      return { c, x: p.x, y: p.y, a: p.a || 0, n }; });
    for (let i = 0; i < placed.length; i++) for (let j = i + 1; j < placed.length; j++) {
      const A = placed[i], B = placed[j]; const d = Math.hypot((A.x - B.x) * sc, (A.y - B.y) * sc);
      if (d < minGap && A.c[5].seg !== undefined && B.c[5].seg !== undefined) { const push = (minGap - d) / 2 * k + 1.5 * k; A.x += A.n.x * push; A.y += A.n.y * push; B.x -= B.n.x * push; B.y -= B.n.y * push; }
    }
    let fol = { tf: '' }, tip = { show: false };
    const dots = placed.map(p => { const c = p.c, fl = c[6];
      if (fl === 'follow') fol = { tf: 'translate(' + f(p.x) + ' ' + f(p.y) + ') ' + kq };
      if (hov === c[0]) { const s = toScr(p.x, p.y); const left = Math.max(4, Math.min(280 - 150, s.x - 64)); const top = s.y < 64 ? s.y + 12 : s.y - 34;
        tip = { show: true, num: String(c[1]), code: c[0], pos: c[3], gap: c[4], gc: c[4].startsWith('+') ? '#e6edf3' : '#ffb066',
          style: 'position:absolute;left:' + f(left) + 'px;top:' + f(top) + 'px;white-space:nowrap;padding:3px 8px;border-radius:5px;background:#0b0d10;border:1px solid rgba(255,255,255,.18);box-shadow:0 4px 12px rgba(0,0,0,.5);font-size:12px;font-weight:600;pointer-events:none' }; }
      return { code: c[0], c: fl === 'dnf' ? '#6e7781' : c[2], o: fl === 'dnf' ? .8 : 1,
        tf: 'translate(' + f(p.x) + ' ' + f(p.y) + ') ' + kq, rot: 'rotate(' + f(p.a) + ')',
        dot: fl !== 'follow' && !(zoom && p.c[5].seg !== undefined), zoomCar: zoom && fl !== 'follow' && p.c[5].seg !== undefined,
        dnf: fl === 'dnf', pit: fl === 'pit', leader: fl === 'leader', label: zoom && fl !== 'follow', lx: zoom ? 18 : 7,
        enter: () => this.setState({ hov: c[0] }), leave: () => this.setState({ hov: '' }) };
    });
    const s2Mid = at(7, .5, -16 * k);
    const scP = at(6, .45, 0);
    const on = 'width:24px;height:22px;border:0;border-radius:4px;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0';
    const off = 'width:24px;height:22px;border:0;border-radius:4px;background:transparent;color:#8b949e;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0';
    return {
      vb: f(vbx) + ' ' + f(vby) + ' ' + f(vbw) + ' ' + f(vbh), trackD, pitD: 'M 400 520 C 430 450, 450 380, 470 330 C 490 285, 520 258, 600 258 L 1340 258 C 1420 258, 1470 290, 1485 350 L 1500 470',
      w, sectors, drs, fin, turns, dots, fol, tip, s2d: poly(S2),
      yellow: ev === 'jaune', sc: ev === 'sc', flag: 'translate(' + f(s2Mid.x) + ' ' + f(s2Mid.y) + ') ' + kq, scPos: 'translate(' + f(scP.x) + ' ' + f(scP.y) + ') ' + kq,
      isZoom: zoom, isFull: !zoom, btnFull: zoom ? off : on, btnZoom: zoom ? on : off,
      setFull: () => this.setState({ mode: 'complet' }), setZoom: () => this.setState({ mode: 'zoom' }),
      bar: [{ w: '28%', c: '#5b8def' }, { w: '0%', c: '#e0b84a' }, { w: '0%', c: '#4fbf86' }],
      aria: zoom ? 'Carte zoomée autour de MIR' : 'Circuit de Valmora, 12 voitures, MIR en P2'
    };
  }
}
</script>
</body>
</html>
