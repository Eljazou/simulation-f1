<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pit stop — chrono de l'arrêt</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.cond{font-family:'Barlow Condensed',sans-serif}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8b949e}
.glass{background:rgba(15,17,21,.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
</style>
</helmet>
<div style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Barlow',sans-serif;color:#e6edf3;background:#1e2125">
<svg aria-hidden="true" width="1280" height="720" viewBox="0 0 1280 720" style="position:absolute;inset:0">
<rect width="1280" height="160" fill="#17261c"></rect>
<rect y="160" width="1280" height="10" fill="#e9e9e9"></rect>
<rect y="170" width="1280" height="150" fill="#2b2e33"></rect>
<rect y="320" width="1280" height="6" fill="#f5c518"></rect>
<rect y="326" width="1280" height="130" fill="#34373c"></rect>
<g fill="#ffffff" opacity=".5"><rect x="100" y="388" width="40" height="4"></rect><rect x="200" y="388" width="40" height="4"></rect><rect x="300" y="388" width="40" height="4"></rect><rect x="860" y="388" width="40" height="4"></rect><rect x="960" y="388" width="40" height="4"></rect><rect x="1060" y="388" width="40" height="4"></rect><rect x="1160" y="388" width="40" height="4"></rect></g>
<rect y="456" width="1280" height="264" fill="#202328"></rect>
<g fill="#26292f" stroke="#2e3239"><rect x="40" y="476" width="220" height="200"></rect><rect x="280" y="476" width="220" height="200"></rect><rect x="780" y="476" width="220" height="200"></rect><rect x="1020" y="476" width="220" height="200"></rect></g>
<rect x="520" y="456" width="240" height="220" fill="#2a2420" stroke="#ff8a1f" stroke-width="2"></rect>
<rect x="520" y="340" width="240" height="116" fill="none" stroke="#ff8a1f" stroke-width="2" stroke-dasharray="8 6"></rect>
<rect x="580" y="376" width="120" height="44" rx="14" fill="#ff8a1f" stroke="#fff" stroke-width="3"></rect>
<g fill="#0b0c0f"><rect x="592" y="364" width="26" height="12" rx="3"></rect><rect x="662" y="364" width="26" height="12" rx="3"></rect><rect x="592" y="420" width="26" height="12" rx="3"></rect><rect x="662" y="420" width="26" height="12" rx="3"></rect></g>
<g fill="#ff8a1f" opacity=".9"><circle cx="605" cy="350" r="8"></circle><circle cx="675" cy="350" r="8"></circle><circle cx="605" cy="446" r="8"></circle><circle cx="675" cy="446" r="8"></circle><circle cx="560" cy="398" r="8"></circle><circle cx="720" cy="398" r="8"></circle></g>
<g stroke="#0b0c0f" stroke-width="2"><rect x="240" y="236" width="56" height="24" rx="8" fill="#2f7bff"></rect><rect x="380" y="226" width="56" height="24" rx="8" fill="#19c3a6"></rect></g>
</svg>

<div class="glass cond" style="position:absolute;top:12px;left:50%;transform:translateX(-50%);height:40px;padding:0 18px;display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:.08em">COURSE · TOUR 4/5 · SEC</div>

<section class="glass" aria-label="Limiteur des stands" style="position:absolute;left:12px;bottom:12px;width:300px;height:76px;display:flex;align-items:center;gap:14px;padding:0 16px;box-sizing:border-box">
<div><div class="cond" style="font-size:44px;font-weight:700;line-height:.9">80</div><div class="lbl" style="font-size:11px">km/h</div></div>
<div style="flex:1;display:flex;flex-direction:column;gap:6px"><span class="cond" style="align-self:flex-start;font-size:13px;font-weight:700;letter-spacing:.1em;padding:2px 8px;border-radius:4px;background:#2f80ff;color:#fff">LIMITEUR</span><span style="font-size:12px;color:#a3acb6">Voie des stands · 80 km/h max</span></div>
</section>

<section class="glass" aria-label="Arrêt au stand en cours" style="position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:560px;box-sizing:border-box;overflow:hidden">
<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.08)">
<div style="display:flex;align-items:center;gap:10px"><span style="width:4px;height:18px;border-radius:2px;background:#ff8a1f"></span><span class="cond" style="font-size:18px;font-weight:700;letter-spacing:.08em">ARRÊT AU STAND</span><span class="cond" style="font-size:15px;font-weight:700;color:#ffb066">MIR</span></div>
<span style="display:flex;align-items:center;gap:6px;font-size:13px;color:#c9d1d9">M <svg aria-hidden="true" width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="#c9d1d9" stroke-width="2"><path d="M0 5h12M8 1l4 4-4 4"></path></svg><span style="width:18px;height:18px;border-radius:50%;box-sizing:border-box;border:2px solid #f2f2f2;display:inline-flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-size:11px;font-weight:700;color:#f2f2f2">H</span></span>
</div>
<div style="display:grid;grid-template-columns:170px 1fr;column-gap:20px;padding:12px 16px;align-items:center">
<div>
<div class="mono" style="font-size:44px;font-weight:600;line-height:1;color:#fff">2.1<span style="color:#8b949e">8</span></div>
<div class="lbl" style="font-size:11px;margin-top:4px">secondes · record équipe 2.04</div>
</div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px">
<sc-for list="{{wheels}}" as="w" hint-placeholder-count="4">
<div style="height:46px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;{{w.bg}}">
<span class="cond" style="font-size:13px;font-weight:700;letter-spacing:.06em">{{w.n}}</span>
<span class="mono" style="font-size:11px;color:{{w.c}}">{{w.t}}</span>
</div>
</sc-for>
</div>
</div>
<div style="display:grid;grid-template-columns:2fr 1fr 2fr;gap:4px;padding:0 16px 12px 16px">
<div><div style="height:4px;border-radius:2px;background:#2ecc71"></div><div class="lbl" style="font-size:10px;margin-top:4px;display:flex;justify-content:space-between"><span>Entrée</span><span class="mono" style="color:#c9d1d9">9.6 s</span></div></div>
<div><div style="height:4px;border-radius:2px;background:linear-gradient(90deg,#ff8a1f 70%,rgba(255,255,255,.12) 70%)"></div><div class="lbl" style="font-size:10px;margin-top:4px;color:#ffb066">Arrêt</div></div>
<div><div style="height:4px;border-radius:2px;background:rgba(255,255,255,.12)"></div><div class="lbl" style="font-size:10px;margin-top:4px;display:flex;justify-content:space-between"><span>Sortie</span><span class="mono">≈ 8.9 s</span></div></div>
</div>
<div style="display:flex;justify-content:space-between;padding:8px 16px;background:rgba(0,0,0,.2);font-size:12px;color:#a3acb6"><span>Ressort estimé <b class="cond" style="font-size:14px;color:#fff">P5</b> devant LUN (+1.1 s)</span><span>Perte totale ≈ 20.7 s</span></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const done = 'background:rgba(46,204,113,.14);box-shadow:inset 0 0 0 1px rgba(46,204,113,.5)';
    const run = 'background:rgba(255,138,31,.14);box-shadow:inset 0 0 0 1px rgba(255,138,31,.6)';
    const wheels = [
      { n: 'AV G', t: '✓ 1.92', c: '#2ecc71', bg: done }, { n: 'AV D', t: '✓ 2.03', c: '#2ecc71', bg: done },
      { n: 'AR G', t: '✓ 1.98', c: '#2ecc71', bg: done }, { n: 'AR D', t: 'en cours', c: '#ffb066', bg: run }
    ];
    return { wheels };
  }
}
</script>
</body>
</html>
